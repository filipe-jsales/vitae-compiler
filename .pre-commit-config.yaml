repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: local
    hooks:
      - id: validate-cv-schema
        name: Validar dados do currículo contra os JSON Schemas
        entry: python src/validate.py
        language: system
        pass_filenames: false
        files: ^(data/|schema/)
