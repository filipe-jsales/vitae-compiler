name: Validate Schema

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "src/validate.py"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "src/validate.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data/example against schema/
        run: python src/validate.py --data data/example --schema schema
